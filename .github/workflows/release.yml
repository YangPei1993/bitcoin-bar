name: Build & Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Release App (Ad-hoc Signed)
        run: |
          xcodebuild \
            -project bitcoin-bar.xcodeproj \
            -scheme bitcoin-bar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package ZIP & Checksum
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          ARTIFACT="bitcoin-bar-${VERSION}-macOS.zip"
          cd build/DerivedData/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent bitcoin-bar.app "$GITHUB_WORKSPACE/$ARTIFACT"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "$ARTIFACT" > "${ARTIFACT}.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitcoin-bar-macOS
          path: |
            bitcoin-bar-*.zip
            bitcoin-bar-*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bitcoin-bar-*.zip
            bitcoin-bar-*.sha256
